name: Deploy web version to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The Firebase web API key lives in the FIREBASE_API_KEY repository secret, never in the repo.
      - name: Add the Firebase web API key
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then echo "::error::Set the FIREBASE_API_KEY repository secret."; exit 1; fi
          grep -q "'__FIREBASE_API_KEY__'" web/index.html
          sed -i "s|'__FIREBASE_API_KEY__'|'${FIREBASE_API_KEY}'|" web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
