<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud saves · RatIdle</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#2a231a;--panel:#3e3529;--edge:#15110c;--text:#e8dcc0;--muted:#c8b898;--gold:#ff981f;--ok:#60e060;--no:#ff6a50}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:460px;margin:0 auto;padding:48px 16px}
.box{background:var(--panel);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px #5d5447;padding:8px 20px 20px;text-align:center}
h1{font:600 30px "Pixelify Sans",system-ui,sans-serif;color:var(--gold);text-shadow:2px 2px 0 #000;margin:10px 0}
p{margin:10px 0}.ok{color:var(--ok)}.no{color:var(--no)}.muted{color:var(--muted);font-size:14px}
input,button,a.btn{font:inherit;box-sizing:border-box;width:100%;padding:10px;margin-top:8px;border:2px solid var(--edge)}
input{background:#2a231a;color:var(--text)}
button,a.btn{display:block;background:#2f5a22;color:#fff;cursor:pointer;text-decoration:none;text-shadow:1px 1px 0 #000}
button:disabled{opacity:.5}
</style>
<main><div class="box"><h1 id="t">RatIdle</h1><div id="b"><p>One moment...</p></div></div></main>
<script>
// Handles the links in RatIdle's cloud-save emails (verify email, reset password, recover email) with Firebase Auth's
// REST API, the same way the game talks to it. Firebase's email templates point here (Authentication > Templates >
// action URL). The key is the game's Firebase web API key, filled in by the Pages workflow like index.html's.
(function(){
  'use strict';
  var KEY='__FIREBASE_API_KEY__',GAME='./';
  var q=new URLSearchParams(location.search),mode=q.get('mode'),code=q.get('oobCode');
  if(!/^AIza[\w-]{35}$/.test(KEY))KEY=q.get('apiKey')||'';
  var t=document.getElementById('t'),b=document.getElementById('b');
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var done=function(title,html){t.textContent=title;b.innerHTML=html+'<a class="btn" href="'+GAME+'">Open RatIdle</a>';};
  var ERR={EXPIRED_OOB_CODE:'This link has expired. Ask the game for a new one.',INVALID_OOB_CODE:'This link has already been used, or is incomplete. Ask the game for a new one.',
    USER_DISABLED:'That account has been disabled.',USER_NOT_FOUND:'That account no longer exists.',WEAK_PASSWORD:'Use a password of at least 6 characters.'};
  var fail=function(e){var c=String(e&&e.message||e).split(/[ :]/)[0];done('Something went wrong','<p class="no">'+esc(ERR[c]||'That did not work. Try the link again, or ask the game for a new one.')+'</p>');};
  function call(path,body){
    return fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+path+'?key='+encodeURIComponent(KEY),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error&&j.error.message||r.status);return j;});});
  }
  if(!code||!KEY){fail('INVALID_OOB_CODE');return;}
  if(mode==='verifyEmail'){
    call('update',{oobCode:code}).then(function(j){
      done('Email verified','<p class="ok">'+esc(j.email||'Your email')+' is verified.</p><p>Back in RatIdle, open <b>Options › Cloud save</b> to back up your saves. RatIdle Pro bought on this account now unlocks wherever you sign in.</p><p class="muted">If the game was already open, it notices within a minute or two, or when you open Cloud saves.</p>');
    },fail);
  }else if(mode==='resetPassword'){
    call('resetPassword',{oobCode:code}).then(function(j){
      t.textContent='Choose a new password';
      b.innerHTML='<p>For <b>'+esc(j.email)+'</b></p><input id="p1" type="password" minlength="6" autocomplete="new-password" placeholder="New password"><input id="p2" type="password" minlength="6" autocomplete="new-password" placeholder="Same again"><p class="no" id="m"></p><button id="go">Save password</button>';
      var go=document.getElementById('go'),m=document.getElementById('m');
      go.onclick=function(){var a=document.getElementById('p1').value,c=document.getElementById('p2').value;
        if(a.length<6){m.textContent=ERR.WEAK_PASSWORD;return;}if(a!==c){m.textContent="Those passwords don't match.";return;}
        go.disabled=true;call('resetPassword',{oobCode:code,newPassword:a}).then(function(){done('Password changed','<p class="ok">Your new password is set. Sign in with it in the game.</p>');},fail);};
    },fail);
  }else if(mode==='recoverEmail'){
    call('resetPassword',{oobCode:code}).then(function(j){return call('update',{oobCode:code}).then(function(){
      done('Email restored','<p class="ok">Your account email is back to '+esc(j.email||'what it was')+'.</p><p>If you didn\'t ask for the change, reset your password from the game\'s sign-in window.</p>');});},fail);
  }else fail('INVALID_OOB_CODE');
})();
</script>
</html>
