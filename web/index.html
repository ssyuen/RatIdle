<script>
// Installed to the home screen (PWA): fill the whole screen. iOS can hand a home-screen app a viewport that still
// leaves room for Safari's toolbar, so there the height comes from the screen itself. --app-h is the height the
// page and the game use; html.pwa switches the layout over to it.
(function(){
  var d=document.documentElement,ios=navigator.standalone===true;
  if(!(ios||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches))return;
  d.classList.add('pwa');
  function fit(){var land=innerWidth>innerHeight,h=innerHeight;
    if(ios)h=Math.max(h,land?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height));
    d.style.setProperty('--app-h',h+'px');}
  fit();addEventListener('resize',fit);
  addEventListener('orientationchange',function(){setTimeout(function(){fit();dispatchEvent(new Event('resize'));},350);});
})();
</script>

#title .tbox{width:min(440px,100%);background:var(--stone-2);border:3px solid var(--stone-0);box-shadow:inset 0 0 0 2px var(--stone-3),0 10px 40px rgba(0,0,0,.5);padding:16px 16px 12px}

html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--white)}

#modal .body{color:var(--text);font-size:14px;line-height:1.4;text-shadow:1px 1px 0 #000;overflow:auto;min-height:0;touch-action:pan-y}
#modal .btns{display:flex;gap:8px;margin-top:12px}
.trade .card{text-align:left;align-items:flex-start}
.trade .tq{display:flex;align-items:center;gap:6px;margin-top:4px}
.trade .tq input[type=range]{flex:1;min-width:0;accent-color:var(--gold)}
.trade .tq input[type=number]{width:5.2em;font:13px var(--font);background:var(--stone-0);color:var(--white);border:1px solid var(--stone-3);padding:2px 4px}
.trade .tb{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
body.touch .trade .tb .btn{padding:7px 10px}
.trade .price{color:var(--gold);font-size:12px;white-space:nowrap;text-align:right}
.trade .price s{color:var(--muted);text-decoration:none;font-size:11px;display:block}
/* tutorial: dims the screen, rings the menu item being explained, and shows a card styled like #modal */
#tut{position:fixed;inset:0;z-index:34;touch-action:none}
#tut.center{background:rgba(0,0,0,.55)}
#tut-hl{position:fixed;border:3px solid var(--gold);box-shadow:0 0 0 9999px rgba(0,0,0,.55),0 0 0 1px #000,0 0 16px rgba(255,152,31,.8);pointer-events:none;animation:tuthl 1.1s ease-in-out infinite alternate}
@keyframes tuthl{from{border-color:var(--gold)}to{border-color:var(--yellow)}}
#tut-card{position:fixed;width:min(300px,calc(100vw - 32px));box-sizing:border-box;background:var(--stone-2);border:3px solid var(--stone-0);box-shadow:inset 0 0 0 2px var(--stone-3),0 10px 30px rgba(0,0,0,.5);padding:12px 14px;text-align:center}
#tut-card .ts{font-size:11px;color:var(--muted);letter-spacing:.1em;text-shadow:1px 1px 0 #000}
#tut-card h2{color:var(--gold);margin:2px 0 6px;font-size:19px;font-weight:600;text-shadow:2px 2px 0 #000}
#tut-card .body{color:var(--text);font-size:14px;line-height:1.4;text-shadow:1px 1px 0 #000}
#tut-card .body b{color:var(--yellow);font-weight:600}
#tut-card .btns{display:flex;gap:8px;margin-top:10px}
#tut-card .btns .btn{margin:0}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:25;transition:opacity .45s}
/* Focus button: bottom centre whenever no timer runs, above the game log where the two would meet. */
#focusbtn{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;background:linear-gradient(#e8634a,#a8301f);color:var(--white);border:3px solid var(--stone-0);box-shadow:inset 0 0 0 2px #ff9a80,0 4px 14px rgba(0,0,0,.45);font:600 22px var(--font);padding:7px 34px 9px;cursor:pointer;text-shadow:2px 2px 0 #000;letter-spacing:.04em}
#focusbtn:hover{filter:brightness(1.1)}
#focusbtn.end{background:linear-gradient(#4a3f33,#2a231a);box-shadow:inset 0 0 0 2px var(--stone-3),0 4px 14px rgba(0,0,0,.45);color:#ffb0a0;font-size:18px;padding:6px 24px 8px}
#focusbtn:active{transform:translateX(-50%) translateY(2px)}
@media (max-width:1180px){#focusbtn{bottom:calc(164px + env(safe-area-inset-bottom,0px))}}
#placebar{position:fixed;left:50%;bottom:calc(166px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,14,8,.85);border:2px solid var(--gold);padding:6px 10px;z-index:8;display:flex;gap:8px;align-items:center;font-size:13px;text-shadow:1px 1px 0 #000;max-width:calc(100vw - 32px)}
/* click cross */
.xmark{position:fixed;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none;z-index:15;animation:xm .45s steps(4) forwards}
.xmark::before,.xmark::after{content:"";position:absolute;left:5px;top:-1px;width:4px;height:16px;background:var(--c,#ff0);border:1px solid #000;box-sizing:border-box}
.xmark::before{transform:rotate(45deg)} .xmark::after{transform:rotate(-45deg)}
@keyframes xm{from{transform:scale(1.15)}to{transform:scale(.25);opacity:.6}}
#xpdrops{position:fixed;right:calc(258px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));pointer-events:none;z-index:6}
body.nomenus #xpdrops{right:calc(180px + env(safe-area-inset-right,0px))}
.xpd{position:absolute;right:0;top:0;white-space:nowrap;font-size:15px;color:var(--white);text-shadow:1px 1px 0 #000;display:flex;align-items:center;gap:4px;animation:xpd 1.6s linear forwards}
.xpd img{width:20px;height:18px;image-rendering:pixelated}
@keyframes xpd{0%{transform:translateY(90px);opacity:1}80%{opacity:1}100%{transform:translateY(0);opacity:0}}
#nametag{position:fixed;transform:translate(-50%,-100%);color:#ffff40;font-size:14px;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;white-space:nowrap;pointer-events:none;z-index:3} /* under the side panel and game log */
#banner{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(0,0,0,.65);border:2px solid var(--gold);padding:10px 18px;text-align:center;z-index:12;pointer-events:none;max-width:calc(100vw - 32px)}
#banner .b1{color:var(--gold);font-size:22px;font-weight:600;text-shadow:2px 2px 0 #000}
#banner .b2{color:var(--white);font-size:14px;margin-top:4px;text-shadow:1px 1px 0 #000}
#bagtoggle{display:none}
.lpring{position:fixed;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--yellow);box-shadow:0 0 0 1px #000,inset 0 0 0 1px #000;pointer-events:none;z-index:16;animation:lp .48s linear forwards}
@keyframes lp{from{transform:scale(1.7);opacity:.15}to{transform:scale(.45);opacity:1}}
body.touch #hover{display:none}
body.touch #chatlog{user-select:none;-webkit-user-select:none}
/* Touch screens get finger-sized targets (sizes before the panel's scale-down on small screens). */
body.touch #side{--tabs-h:80px}
body.touch #tabs button{min-height:40px}
body.touch #chatbar span,body.touch #chatbar button{padding:9px 14px}
body.touch .chip{padding:8px 11px;min-width:36px}
body.touch .tab .btn{min-height:38px}
body.touch .opt select,body.touch .opt input[type=text]{min-height:34px}
body.touch #focuspill{padding:6px 14px 7px}
@media (max-width:760px){
  #side{transform:scale(.78);--side-scale:.78}
  #chat{width:calc(100vw - 16px);height:96px}
  body.touch #chat{height:112px}
  #chatlog{font-size:12px}
  #xpdrops{right:calc(205px + env(safe-area-inset-right,0px))}
  body.nomenus #xpdrops{right:calc(140px + env(safe-area-inset-right,0px))}
  #bagtoggle{display:block}
  #focuspill{min-width:0}
  #placebar{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
  #banner{top:auto;bottom:calc(178px + env(safe-area-inset-bottom,0px))}
  #focusbtn{bottom:calc(108px + env(safe-area-inset-bottom,0px));font-size:19px;padding:6px 28px 8px}
  body.touch #focusbtn{bottom:calc(124px + env(safe-area-inset-bottom,0px))}
}
@media (max-height:560px){ #side{transform:scale(.72);--side-scale:.72} #chat{height:100px} #focusbtn{bottom:calc(112px + env(safe-area-inset-bottom,0px))} }
/* Short landscape phones: keep the game log clear of the side panel (244px wide at 72%). */
@media (max-height:560px) and (orientation:landscape){ #chat{width:min(520px,calc(100vw - 190px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)))} }
@media (prefers-reduced-motion:reduce){ #tut-hl{animation:none} .xpd{animation-duration:.01s} .xmark{animation:none} #fade{transition:none} }

// Somewhere to stand by the thing a villager's skill works with: a tree, a rock, the shore by the fish, the furnace or the fire.
// It stands on the island side of it, clear of anything solid, and looks at it.
function npcTarget(e){
  const sk=npcSkill(e.isle,e.j),pickOne=a=>a.length?a[randi(0,a.length-1)]:null;
  const near=(o,r)=>{const a=Math.atan2(-o.z,-o.x)+rand(-1.1,1.1);return{x:o.x+Math.cos(a)*r,z:o.z+Math.sin(a)*r,lx:o.x,lz:o.z};};
  for(let k=0;k<10;k++){let t=null;
    if(sk==='woodcutting'){const o=pickOne(trees.filter(t=>t.state==='alive'));if(o)t=near(o,o.cr+1.3);}
    else if(sk==='mining'){if(e.under){const o=pickOne(rocks);if(o)t=near(o,1.7);}else t=near(MINE,MINE.r+rand(1,2.2));}
    else if(sk==='fishing'){const o=pickOne(fishAreas.flat());if(o){const f=(ISLAND-4)/Math.hypot(o.x,o.z);t={x:o.x*f+rand(-1,1),z:o.z*f+rand(-1,1),lx:o.x,lz:o.z};}}
    else t=near(sk==='smithing'?FURNACE:FIRE,sk==='smithing'?2.4:2.1);
    if(!t)t={x:SITE.x+rand(-3,3),z:SITE.z+rand(2.5,4),lx:SITE.x,lz:SITE.z};
    if(e.under){if(Math.hypot(t.x,t.z)>CAVE_R-1||caveObstacles.concat(rocks).some(o=>o.kind!=='npc'&&Math.hypot(o.x-t.x,o.z-t.z)<(o.r||o.cr)+.6))continue;return t;}
    if(Math.hypot(t.x,t.z)>ISLAND-3.2||height(t.x,t.z)<WATER_Y+.3)continue;
    if(obstacles.some(o=>o.kind!=='npc'&&Math.hypot(o.x-t.x,o.z-t.z)<o.r+.7)||trees.some(o=>o.r>0&&Math.hypot(o.x-t.x,o.z-t.z)<o.r+.5))continue;
    return t;}
  return{x:e.x,z:e.z,lx:e.x+Math.sin(e.face),lz:e.z+Math.cos(e.face)};
}

function updateNpcs(dt,T){for(const e of npcs){
  if(e.miner&&!e.t.go&&!(e.hold>0)&&(e.shift-=dt)<=0){const d=mineDir(),p=e.under?{x:CAVE_EXIT.x+d.x*1.4,z:CAVE_EXIT.z+d.z*1.4}:mineDoor();e.t={x:p.x,z:p.z,lx:MINE.x,lz:MINE.z,go:true};}
  const near=e.under===inMine()&&!inCabin(),d=near?Math.hypot(player.x-e.x,player.z-e.z):99,t=e.t;let walking=false,want;
  if(d<3.2||e.hold>0){e.hold=Math.max(0,(e.hold||0)-dt);want=Math.atan2(player.x-e.x,player.z-e.z);}
  else{const dx=t.x-e.x,dz=t.z-e.z,dd=Math.hypot(dx,dz);
    if(dd>.08){const st=Math.min(dd,1.25*dt);e.x+=dx/dd*st;e.z+=dz/dd*st;want=Math.atan2(dx,dz);walking=true;}
    else if(t.go){npcShift(e);continue;}
    else{want=Math.atan2(t.lx-e.x,t.lz-e.z)+Math.sin(T*.3+e.j*1.7)*.35;if((e.wait-=dt)<=0){e.t=npcTarget(e);e.wait=rand(12,28);}}}
  e.face=angLerp(e.face,want,dt*(walking?6:3));e.walkT+=walking?dt*7:0;const sw=walking?Math.sin(e.walkT)*.6:0;
  e.legs[0].rotation.x=lerp(e.legs[0].rotation.x,sw,Math.min(1,dt*12));e.legs[1].rotation.x=lerp(e.legs[1].rotation.x,-sw,Math.min(1,dt*12));
  e.g.position.set(e.x,npcY(e),e.z);e.g.rotation.y=e.face;e.head.rotation.x=Math.sin(T*1.3+e.j)*.06;
  e.g.children[0].position.y=walking?Math.abs(Math.cos(e.walkT))*.05:Math.abs(Math.sin(T*1.1+e.j))*.02;}}

  const lines=[e.line,`I'm a ${S.toLowerCase()} rat, through and through. And now that the ${ISLANDS[e.isle].name} hut is up, I've got somewhere to live!`,
    `Since I moved in: ${tip}. That works on every isle, so come and visit whenever you like.`];
  let i=0;const show=()=>modal(e.name,`<p style="margin-top:0">"${esc(lines[i])}"</p><p class="hint">${esc(S)} villager · ${esc(tip)}</p>`,
    [...(i<lines.length-1?[{label:'Next',cls:'go',keep:true,fn:()=>{i++;show();}}]:[]),{label:'Bye'}]);
  show();msg(`${esc(e.name)}: "${esc(e.line)}"`);

function logWall(group,len,axis,cx,cy,cz,colA,colB,rows=6,gap=null,gapRows=5){
  const r=.2;
  const add=(L,off,y,c)=>{const m=mesh(new THREE.CylinderGeometry(r,r,L,6),c,0,0,0);
    if(axis==='x'){m.rotation.z=Math.PI/2;m.position.set(cx+off,cy+y,cz);}else{m.rotation.x=Math.PI/2;m.position.set(cx,cy+y,cz+off);}
    m.castShadow=false;group.add(m);};
  for(let i=0;i<rows;i++){const y=r+i*r*1.95,c=i%2?colB:colA;
    if(gap&&i<gapRows){const a=-len/2,b=len/2;if(gap[0]-a>.05)add(gap[0]-a,(a+gap[0])/2,y,c);if(b-gap[1]>.05)add(b-gap[1],(gap[1]+b)/2,y,c);}
    else add(len+.3,0,y,c);}
}

class TreeEnt{

function updatePet(dt,T){

  else if(player.resting){lL=lR=-1.45;aL=aR=-1.05;azL=.28;azR=-.28;headX=.38;drop=.9-(sp.h??.45);lean=-.05;

  else if(a==='walk'){player.walkT+=dt*9.5;const s=Math.sin(player.walkT);lL=s*.7;lR=-s*.7;aL=-s*.55;aR=s*.55;bob=Math.abs(Math.cos(player.walkT))*.07;}

  else if(a==='fishing'){aR=-1.15+Math.sin(T*2)*.05;aL=-1.0;azL=.3;azR=-.1;lL=.1;lR=-.1;}
  else if(a==='cooking'){aR=aL=-1.2+Math.sin(T*3)*.08;azL=.25;azR=-.25;lean=.15;}

}

const CAVE_DARK=0x0b0907;

function caveSpot(rmin,rmax,minD){
  for(let i=0;i<400;i++){const a=rand(0,Math.PI*2),r=Math.sqrt(rand(rmin*rmin,rmax*rmax)),x=Math.cos(a)*r,z=Math.sin(a)*r;

    if(Math.hypot(x-CAVE_EXIT.x,z-CAVE_EXIT.z)<4.5)continue;return{x,z};}
  return null;
}
// The cave under the isle: a rocky floor as wide as the isle, a ring of rock wall, stalagmites, glowing crystals in

  const P=I.pal,stone=shade(P.rock,-.12),dark=shade(P.rock,-.26),f1=new THREE.Color(shade(P.dirt2,-.12)),f2=new THREE.Color(shade(P.rock,-.2)),fe=new THREE.Color(CAVE_DARK);
  const geo=new THREE.PlaneGeometry(92,92,72,72);geo.rotateX(-Math.PI/2);const g=geo.toNonIndexed();geo.dispose();
  const p=g.attributes.position,col=new Float32Array(p.count*3);

    tmpC.copy(f1).lerp(f2,.35+Math.sin(cx*.17)*Math.cos(cz*.13)*.35).offsetHSL(0,0,(n-.5)*.05);if(Math.hypot(cx,cz)>ISLAND)tmpC.copy(fe);
    for(let k=0;k<3;k++){col[(i+k)*3]=tmpC.r;col[(i+k)*3+1]=tmpC.g;col[(i+k)*3+2]=tmpC.b;}}

  caveFloor=new THREE.Mesh(g,groundMat);caveFloor.receiveShadow=true;caveRoot.add(caveFloor);
  // The wall: two rings of tall boulders around the edge.
  for(let ring=0;ring<2;ring++)for(let i=0;i<64;i++){const a=(i+ring*.5)/64*Math.PI*2+rand(-.02,.02),r=ISLAND-.4+ring*1.6+rand(-.3,.4),s=rand(1.6,2.5);
    const m=mesh(new THREE.DodecahedronGeometry(s,0),(i+ring)%2?stone:dark,Math.cos(a)*r,s*.3,Math.sin(a)*r);m.scale.y=rand(1.3,2.1);m.rotation.set(rand(0,3),rand(0,3),0);

  for(let i=0;i<9;i++)L.add(mesh(new THREE.BoxGeometry(.7,.07,.08),shade(wood,-.08),0,.35+i*.5,-.07-i*.09));
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.9,14,10,1,true),new THREE.MeshBasicMaterial({color:0xfff2c0,transparent:true,opacity:.13,depthWrite:false,side:THREE.DoubleSide}));
  const d=mineDir();L.rotation.y=Math.atan2(d.x,d.z);L.position.set(CAVE_EXIT.x,0,CAVE_EXIT.z);tagEnt(L,CAVE_EXIT);cavePick.add(L);

  const cr=buildFurniture('crate','tree');cr.scale.setScalar(.75);cr.position.set(CAVE_SEAT.x,0,CAVE_SEAT.z);cr.rotation.y=.4;tagEnt(cr,CAVE_SEAT);cavePick.add(cr);
  const lantern=(x,z,light)=>{const l=new THREE.Group();l.add(mesh(new THREE.BoxGeometry(.12,1.8,.12),'#5a3e22',0,.9,0),mesh(new THREE.BoxGeometry(.5,.08,.08),'#5a3e22',.2,1.75,0));
    l.add(basic(new THREE.BoxGeometry(.24,.3,.24),0xffc860,.4,1.5,0));

    c.position.set(q.x,0,q.z);caveRoot.add(c);caveObstacles.push({x:q.x,z:q.z,r:.45});}
  for(let i=0;i<28;i++){const q=caveSpot(5,36,1.8);if(!q)continue;const h=rand(.9,2.6),m=mesh(new THREE.ConeGeometry(rand(.3,.55),h,6),chance(.5)?stone:dark,q.x,h/2,q.z);m.rotation.y=rand(0,3);

}

    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;

/* ================= UI: chat, hover, menu, modal ================= */
// The chat keeps every message for the save slot, but repeats fold into one line with a ×count,
// and only the newest lines are kept on screen so a long session never slows the game down.
const chatlog=$('#chatlog');
const LOG_KEY=n=>'ratidle-log-slot-'+n,CHAT_WINDOW=80;
let chatHist=[],chatShown=CHAT_WINDOW,chatDirty=false,chatMore=null;
function drawEntry(el,e){el.className=e.c;el.innerHTML=e.h+(e.n>1?`<span class="cnt">×${e.n.toLocaleString()}</span>`:'');}
function chatNearBottom(){return chatlog.scrollHeight-chatlog.scrollTop-chatlog.clientHeight<40;}
function renderChat(){
  chatlog.innerHTML='';const from=Math.max(0,chatHist.length-chatShown);
  if(from>0){chatMore=document.createElement('button');chatMore.id='chat-more';chatMore.textContent=`Show earlier messages (${from.toLocaleString()} more)`;
    chatMore.onclick=()=>{const h=chatlog.scrollHeight;chatShown+=200;renderChat();chatlog.scrollTop=chatlog.scrollHeight-h;};chatlog.appendChild(chatMore);}
  else chatMore=null;
  for(let i=from;i<chatHist.length;i++){const e=chatHist[i],d=document.createElement('div');drawEntry(d,e);e.el=d;chatlog.appendChild(d);}
  chatlog.scrollTop=chatlog.scrollHeight;
}
// The log can be folded down to its tab bar. While folded, the Game tab counts new lines; clicking it opens the log again.
let logUnread=0;
function setLogHidden(h){
  state.settings.hideLog=h;if(!h)logUnread=0;$('#chat').classList.toggle('nolog',h);
  const b=$('#logtoggle');b.textContent=h?`Game ▸${logUnread?` (${logUnread>99?'99+':logUnread})`:''}`:'Game ▾';b.title=h?'Show the game log':'Hide the game log';
  if(!h)chatlog.scrollTop=chatlog.scrollHeight;
}
$('#logtoggle').addEventListener('click',()=>{setLogHidden(!state.settings.hideLog);save();});
function msg(html,cls){
  cls=cls||'';if(state.settings.hideLog){logUnread++;setLogHidden(true);}const stick=chatNearBottom();
  for(let i=chatHist.length-1;i>=Math.max(0,chatHist.length-4);i--){const e=chatHist[i];
    if(e.h===html&&e.c===cls){e.n++;chatDirty=true;if(e.el&&e.el.isConnected)drawEntry(e.el,e);if(stick)chatlog.scrollTop=chatlog.scrollHeight;return;}}
  const e={h:html,c:cls,n:1};chatHist.push(e);chatDirty=true;
  const d=document.createElement('div');drawEntry(d,e);e.el=d;chatlog.appendChild(d);
  // Drop the oldest line from the screen (never from the history) once past the window.
  const lines=chatlog.querySelectorAll('div');
  if(lines.length>chatShown){chatHist[chatHist.length-lines.length].el=null;lines[0].remove();
    const hidden=chatHist.length-chatShown;
    if(!chatMore){chatMore=document.createElement('button');chatMore.id='chat-more';chatMore.onclick=()=>{const h=chatlog.scrollHeight;chatShown+=200;renderChat();chatlog.scrollTop=chatlog.scrollHeight-h;};chatlog.prepend(chatMore);}
    chatMore.textContent=`Show earlier messages (${hidden.toLocaleString()} more)`;}
  if(stick)chatlog.scrollTop=chatlog.scrollHeight;
}
// Stored log entries are our own messages, but they're re-checked on load: only <b>/<i> tags and known colours survive.
function loadLog(n){
  chatHist=[];chatShown=CHAT_WINDOW;chatDirty=false;
  try{const raw=localStorage.getItem(LOG_KEY(n))??localStorage.getItem(OLD_LOG_KEY(n));const a=raw&&raw.length<8e6?JSON.parse(raw):null;
    if(Array.isArray(a))for(const x of a){if(!Array.isArray(x)||typeof x[0]!=='string')continue;
      chatHist.push({h:x[0].slice(0,600).replace(/<(?!\/?(b|i)>)[^>]*>/g,''),c:['m-red','m-blue','m-green'].includes(x[1])?x[1]:'',n:Math.max(1,Math.floor(Number(x[2])||1))});}}catch(e){}
  renderChat();
}
function saveLog(){if(!slot||!chatDirty)return;chatDirty=false;
  try{localStorage.setItem(LOG_KEY(slot),JSON.stringify(chatHist.map(e=>[e.h,e.c,e.n])));}catch(e){}}

  const i=state.inv.indexOf(null);if(i<0)return false;state.inv[i]={id,q:def.stack?qty:1};

function consume(id,n,bankFirst){

  const fromBank=()=>{const b=Math.min(left,state.bank[id]||0);state.bank[id]=(state.bank[id]||0)-b;if(state.bank[id]<=0)delete state.bank[id];left-=b;};
  if(bankFirst)fromBank();
  for(let i=0;i<28&&left>0;i++){const s=state.inv[i];if(s&&s.id===id){const t=Math.min(left,s.q);s.q-=t;left-=t;if(s.q<=0)state.inv[i]=null;}}
  if(left>0)fromBank();
  renderInv();
}

function itemOpts(i){

function bankOpts(id){

  return[{a:'Withdraw-1',t,tc,fn:()=>withdraw(id,1)},...(id==='coins'?[{a:'Withdraw-100',t,tc,fn:()=>withdraw(id,100)},{a:'Withdraw-1,000',t,tc,fn:()=>withdraw(id,1000)}]:[]),
    {a:'Withdraw-All',t,tc,fn:()=>withdraw(id,1e9)},{a:'Examine',t,tc,fn:()=>msg(itemEx(id))}];

function withdraw(id,n){
  if(!nearChest()){msg('You need to be at the bank chest to withdraw items.');return;}
  if(id==='coins'){n=Math.min(n,state.gold);if(n>0&&addItem('coins',n)){state.gold-=n;updateHud();}else if(n>0)msg("You don't have enough inventory space.");renderInv();renderBank();return;}
  let k=0;while(k<n&&state.bank[id]>0){const ok=ITEMS[id].stack?addItem(id,state.bank[id]):addItem(id,1);if(!ok)break;
    const take=ITEMS[id].stack?state.bank[id]:1;state.bank[id]-=take;k+=take;}
  if(state.bank[id]<=0)delete state.bank[id];
  if(!k)msg("You don't have enough inventory space.");renderInv();renderBank();
}

function layoutTut(){
  if(!tut)return;
  const st=TUT[tut.i],hl=$('#tut-hl'),card=$('#tut-card'),el=st.el&&$(st.el);

    const pad=4;Object.assign(hl.style,{left:r.left-pad+'px',top:r.top-pad+'px',width:r.width+pad*2+'px',height:r.height+pad*2+'px',borderRadius:el.classList.contains('orb')?'50%':'0'});
    const cx=clamp(r.left+r.width/2-w/2,m,W-w-m),cy=clamp(r.top,m,H-h-m);

    else if(r.top-gap-h>=m){x=cx;y=r.top-gap-h;}

// Better tools (or, for skills without tools, higher levels) work lower-tier resources faster:

let kitchenHint='';
function autoNext(){

  // Inside the cabin AUTO only cooks; for anything else it waits until you step outside.
  if(c&&!cook)return;
  if(!c&&autoStuck())return;
  // Processing skills gather a full pack first (or use stock already banked), then process it all in one go.
  // The furnace, hut and bank are up top and the kitchen is in the cabin, so climb out of the mine for them.
  if(isProc(act)){const r=bestRecipe(act),kitchen=!cook||state.island==='greenhaven';
    if(r&&kitchen&&(!invFree()||(state.bank[r.input]||0)>=r.n)){if(m)exitMine();else if(cook&&!c)player.action={type:'cabin',ent:CABIN};else startProcess(act,null,true);return;}
    if(cook&&!kitchen&&kitchenHint!==state.island){kitchenHint=state.island;msg(`There's no kitchen on ${esc(I.name)}, so AUTO banks your catch. Cook it in your cabin on Greenhaven.`,'m-blue');}}

function applyState(s){
  stopAction();cancelPlacing();closeMenu();
  state=sanitize(s,{allowFocus:true});player.restMode=null;player.resting=false;restPrev=null;restSpot=null;
  buildIsland(state.island);
  player.x=state.pos&&isFinite(state.pos.x)?state.pos.x:0;player.z=state.pos&&isFinite(state.pos.z)?state.pos.z:3;
  if(inCabin()){const R=room();if(Math.abs(player.x-INT.x)>R.w){player.x=INT.x;player.z=INT.z;}}
  else if(Math.hypot(player.x,player.z)>ISLAND)player.x=0,player.z=3;
  showLocation();snapCam();
  spawnPet();
  refreshTools();applyOutfit();updateAutoOrb();updateHud();updateFocusHud(true);renderInv();renderTab();
  setMenusHidden(!!state.settings.hideMenus);logUnread=0;setLogHidden(!!state.settings.hideLog);updatePovBar();updateRelaxOrb();setBookCover();
}
function bestGatherDef(sk){
  const L=level(sk);let defs;
  if(sk==='woodcutting')defs=Object.keys(I.trees).map(k=>TREES[k]);
  else if(sk==='mining')defs=I.tiers.map(t=>ROCKS[t]);
  else defs=I.tiers.map(t=>FISHES[t]);
  defs=defs.filter(d=>d.lvl<=L);if(!defs.length)return null;
  return defs.sort((a,b)=>b.xp*gatherChance(sk,b)/cycleFor(sk,b)-a.xp*gatherChance(sk,a)/cycleFor(sk,a))[0];
}
// Catch up time that passed while the game wasn't running (or the player was away reading).
// What changed while the player was away: XP per skill, character XP, gold, hut progress and items, split into
// what went to the bank and what is in the pack. Taken before and after a catch-up and shown as one summary.
function gainSnap(){const bank={},pack={};for(const id in ITEMS){bank[id]=state.bank[id]||0;pack[id]=0;}
  for(const x of state.inv)if(x)pack[x.id]+=x.q;
  return{skills:Object.assign({},state.skills),lv:Object.fromEntries(SKILL_ORDER.map(k=>[k,level(k)])),fxp:state.fxp,gold:state.gold,
    build:state.construction[state.island]||0,isle:state.island,bank,pack};}
const gainQueue=[];
function showGains(snap,secs,label){
  if(!snap||!slot||titleOpen)return;const now=gainSnap(),rows=[],used=[];
  const ico=src=>`<img alt="" src="${iconURL(src)}">`,row=(img,name,val,extra='',cls='')=>`<div class="gr ${cls}">${img}<span class="n">${name}${extra}</span><span class="v">${val}</span></div>`;
  const xp=SKILL_ORDER.filter(k=>k!=='construction'&&now.skills[k]-snap.skills[k]>=1).map(k=>row(ico(SKILLS[k].icon),SKILLS[k].name,`+${Math.floor(now.skills[k]-snap.skills[k]).toLocaleString()} XP`,
    now.lv[k]>snap.lv[k]?` <span class="lv">Lv ${snap.lv[k]} → ${now.lv[k]}</span>`:''));
  if(now.isle===snap.isle&&now.build>snap.build)xp.push(row(ico(SKILLS.construction.icon),`${I.name} hut`,`+${((now.build-snap.build)/PROJECT_PTS*100).toFixed(1)}%`,
    now.lv.construction>snap.lv.construction?` <span class="lv">Lv ${snap.lv.construction} → ${now.lv.construction}</span>`:''));
  if(now.fxp>snap.fxp)xp.push(row('<span style="width:26px;text-align:center">★</span>','Character',`+${(now.fxp-snap.fxp).toLocaleString()} XP`));
  if(now.gold>snap.gold)rows.push(row(ico('ancient_coin'),'Gold',`+${(now.gold-snap.gold).toLocaleString()} gp`));
  for(const id in ITEMS){const b=now.bank[id]-snap.bank[id],k=now.pack[id]-snap.pack[id],nm=esc(ITEMS[id].name);
    if(b>0)rows.push(row(ico(id),nm,`+${b.toLocaleString()}`,' <span class="hint" style="margin:0">banked</span>'));
    if(k>0)rows.push(row(ico(id),nm,`+${k.toLocaleString()}`,' <span class="hint" style="margin:0">in pack</span>'));
    if(b+k<0)used.push(row(ico(id),nm,`${(b+k).toLocaleString()}`,' <span class="hint" style="margin:0">used</span>','used'));}
  if(!xp.length&&!rows.length)return;
  const h=Math.floor(secs/3600),m=Math.max(1,Math.floor(secs%3600/60));
  const body=`<div class="gains"><p class="hint" style="margin-top:0">${esc(label)} for ${h?h+'h ':''}${m}m.</p>`+
    (xp.length?`<p class="gsec">Experience</p>${xp.join('')}`:'')+(rows.length?`<p class="gsec">Collected</p>${rows.join('')}`:'')+(used.length?`<p class="gsec">Used up</p>${used.join('')}`:'')+'</div>';
  gainQueue.push(()=>modal('Welcome back!',body,[{label:'Nice!',cls:'go'}]));flushGains();
}
// Wait for any open window (e.g. "Focus complete!") or the tutorial to close first, so nothing is overwritten.
let gainTimer=0;
function flushGains(){if(gainTimer||!gainQueue.length)return;
  const go=()=>{if(!$('#modal').hidden||!$('#tut').hidden||titleOpen){gainTimer=setTimeout(go,500);return;}gainTimer=0;const f=gainQueue.shift();f&&f();if(gainQueue.length)flushGains();};go();}
function catchUp(secs,label){
  if(!state.settings.auto||secs<30||inCabin()&&activity()!=='cooking')return;
  secs=Math.min(secs,8*3600);
  const act=activity(),gs=GATHER_OF[act],d=bestGatherDef(gs);if(!d)return;
  let focusSecs=0;if(state.focus)focusSecs=clamp((state.focus.end-(Date.now()-secs*1000))/1000,0,secs);
  const rate=gatherChance(gs,d)/cycleFor(gs,d)*.55*(1+boost('double',gs));let n=Math.floor(secs*rate);if(n<1)return;
  const xm=s=>state.settings.xpRate*(1+(state.focus&&state.focus.skill===s?(FOCUS_SKILL_BONUS-1)*focusSecs/secs:0))*(1+boost('xp',s));
  const h=Math.floor(secs/3600),m=Math.floor(secs%3600/60),when=`${label||'While you were away'} (${h?h+'h ':''}${m}m)`;
  const before={};SKILL_ORDER.forEach(s=>before[s]=level(s));
  if(act==='construction'&&buildFrac(state.island)<1&&Object.keys(I.trees).some(k=>TREES[k].item===d.item)){
    const logs=Math.floor(n*.7),acts=Math.floor(logs/2);state.skills[gs]+=logs*d.xp*xm(gs);state.stats.got[d.item]=(state.stats.got[d.item]||0)+logs;
    msg(`${when}, you chopped ${logs.toLocaleString()} ${esc(ITEMS[d.item].name.toLowerCase())} and built with them.`,'m-green');addBuild(acts*(1+d.tier)*xm(act));
    for(const s of SKILL_ORDER){const a=level(s);if(s!=='construction'&&a>before[s])levelUp(s,before[s],a);}
    refreshTools();updateHud();return;
  }
  const r=isProc(act)&&RECIPES[act]&&(act!=='cooking'||state.island==='greenhaven')?RECIPES[act][d.tier]:null;
  if(r&&level(act)>=r.lvl){
    n=Math.floor(n*.7);const made=Math.floor(n/r.n);
    state.skills[gs]+=n*d.xp*xm(gs);state.skills[act]+=made*r.xp*xm(act);
    bankAdd(r.output,made);state.stats.got[d.item]=(state.stats.got[d.item]||0)+n;state.stats.made[r.output]=(state.stats.made[r.output]||0)+made;
    msg(`${when}, you gathered ${n.toLocaleString()} ${esc(ITEMS[d.item].name.toLowerCase())} and made ${made.toLocaleString()} ${esc(ITEMS[r.output].name.toLowerCase())}, all banked.`,'m-green');
  }else{
    state.skills[gs]+=n*d.xp*xm(gs);bankAdd(d.item,n);state.stats.got[d.item]=(state.stats.got[d.item]||0)+n;
    msg(`${when}, you gathered ${n.toLocaleString()} ${esc(ITEMS[d.item].name.toLowerCase())} and banked them.`,'m-green');
  }
  for(const s of SKILL_ORDER){const a=level(s);if(a>before[s])levelUp(s,before[s],a);}
  refreshTools();updateHud();if(activeTab==='bank')renderBank();if(activeTab==='skill')renderSkill();
}

let T=0,last=performance.now(),lastWall=Date.now(),hoverTick=0,slowTick=0,lastNear=null;
function frame(){
  // performance.now() rather than the frame timestamp, and never a negative step, so a stalled or odd clock can't freeze the game.
  const now=performance.now(),dt=clamp((now-last)/1000,0,.05);last=now;T+=dt;
  const wall=Date.now();if(wall-lastWall>30000&&!player.restMode&&!titleOpen){if(awaySnap)comeBack();else{const snap=gainSnap(),secs=(wall-lastWall)/1000;catchUp(secs,'While the game was in the background');showGains(snap,secs,'The game was in the background');}}lastWall=wall;
  if(!titleOpen)updatePlayer(dt);animatePlayer(dt,T);updatePet(dt,T);
  for(let i=trees.length-1;i>=0;i--)trees[i]&&trees[i].update(dt,T);
  for(const r of rocks)r.update(dt,T);
  if(!inCabin())updateNpcs(dt,T);
  if(onIsle()){for(const s of spots)s.update(dt,T);updateShips(dt,T);}
  updateFloor(dt,T);
  updateReading(dt);updateParts(dt);updateCamera(dt);
  if(inCabin()){updateCutaway();if(hearthFlames[0]){hearthFlames[0].scale.y=1+Math.sin(T*13)*.2;hearthFlames[1].scale.y=1+Math.sin(T*17+1)*.25;}}
  else if(inMine())updateCaveCutaway(T);
  else{updateWater(T);if(fireFlames[0]){fireFlames[0].scale.set(1+Math.sin(T*13)*.08,1+Math.sin(T*9)*.18,1);fireFlames[1].scale.y=1+Math.sin(T*15+1)*.22;fireLight.intensity=1+Math.sin(T*11)*.15+Math.sin(T*23)*.08;}
    if(furnaceGlow)furnaceGlow.material.color.copy(furnaceGlow.userData.base).multiplyScalar(.88+Math.sin(T*6)*.12);
    if(hazel)hazel.rotation.y=Math.sin(T*.4)*.3;
    if(boatMesh){boatMesh.position.y=WATER_Y+Math.sin(T*1.6)*.06;boatMesh.rotation.z=Math.sin(T*1.1)*.04;}
    if(chimney&&chance(dt*3)&&state.island==='greenhaven'){const p=new THREE.Vector3();chimney.getWorldPosition(p);spawnPart(p.x,p.y+.9,p.z,'#d8d8d8',rand(-.2,.2),.9,rand(-.2,.2),2.2,-.05);}}
  for(const c of clouds){c.position.x+=dt*.9;if(c.position.x>110)c.position.x=-110;}
  if(bannerTimer>0){bannerTimer-=dt;if(bannerTimer<=0)$('#banner').hidden=true;}
  if(++hoverTick%2===0){
    if(placing&&mouse.in&&!IS_TOUCH){const p=pick(mouse.x,mouse.y);if(p&&p.point)placing.ghost.position.set(INT.x+Math.round((p.point.x-INT.x)*4)/4,0,INT.z+Math.round((p.point.z-INT.z)*4)/4);}
    if(hoverUI)setHover(hoverUI);else if(mouse.in&&!menuOpen&&!drag&&!IS_TOUCH&&!placing)setHover(player.restMode?[{a:'Stand up'}]:worldOpts(mouse.x,mouse.y));else if(!menuOpen)setHover(null);
  }
  if((slowTick+=dt)>.25){slowTick=0;if(!titleOpen)updateFocusHud();
if(activeTab==='bank'){const n=nearChest();if(n!==lastNear){lastNear=n;renderBank();}}}
  drawMinimap();updateNameTag();renderer.render(scene,camera);requestAnimationFrame(frame);
}

// Imports are capped in size, must be a RatIdle export, and are rebuilt field-by-field by sanitize().

/* ================= CLOUD SAVES ================= */
// Firebase (project ratidle-be, free Spark plan): email + password accounts and one Firestore document per slot at
// users/{uid}/saves/{slot}, holding the same JSON as Export. It talks to the REST APIs directly so no SDK has to load.
// firestore.rules only lets a player with a verified email read or write their own three slots, caps the size and
// allows one write a minute.
// Cloud saves are opt-in: until the player signs in nothing is sent, and they can turn it off for good (optionally
// deleting their cloud copies and account), after which the game is local-only again.
// Automatic uploads happen at most once every 8 hours and only while the game is in the foreground. Nothing is sent
// while it's hidden; if the 8 hours ran out while it was away, the upload waits until the player is back.
// Every upload is conditional on the cloud copy being the one this device last saw, so one device never silently
// overwrites another's progress. Downloads go through parseImport(), like any other import.
// The web API key is filled in at build time (the Pages workflow and mobile/scripts/build-game.mjs) so it never
// lives in the repo. Without it, e.g. opening index.html straight from a checkout, cloud saves are simply hidden.

  const user=isObj(u)&&typeof u.uid==='string'&&typeof u.refresh==='string'&&typeof u.email==='string'?{uid:u.uid.slice(0,128),email:u.email.slice(0,200),refresh:u.refresh.slice(0,4000),verified:u.verified===true}:null;
  return{device:typeof c.device==='string'&&/^[a-z0-9]{8,24}$/.test(c.device)?c.device:Math.random().toString(36).slice(2,12)+Date.now().toString(36),

// A slot whose local game was replaced (new game, import, delete) must not overwrite its old cloud copy unasked.
function unlinkCloud(n){if(cloud.links[n]){delete cloud.links[n];storeCloud();}delete cloudConflict[n];}
const AUTH_ERR={EMAIL_EXISTS:'That email already has an account. Sign in instead.',INVALID_LOGIN_CREDENTIALS:'Wrong email or password.',
  INVALID_PASSWORD:'Wrong email or password.',EMAIL_NOT_FOUND:'Wrong email or password.',INVALID_EMAIL:"That doesn't look like an email address.",
  MISSING_PASSWORD:'Enter a password.',WEAK_PASSWORD:'Use a password of at least 6 characters.',USER_DISABLED:'That account has been disabled.',
  TOO_MANY_ATTEMPTS_TRY_LATER:'Too many tries. Wait a bit and try again.',OPERATION_NOT_ALLOWED:'Cloud saves are switched off right now.'};
async function cloudFetch(url,opts){
  let r;try{r=await fetch(url,opts);}catch(e){throw 'Could not reach the cloud. Check your connection.';}
  const j=await r.json().catch(()=>({}));if(r.ok)return j;
  const code=String(j.error&&(j.error.message||j.error.status)||r.status).split(/[ :]/)[0];

const sendVerifyEmail=idToken=>postJSON(AUTH_URL+'sendOobCode?key='+FB.key,{requestType:'VERIFY_EMAIL',idToken});
async function cloudSignIn(email,password,create){

// The player's cloud slots: {[slot]:{v (sanitized save), t, last, device}}.
async function cloudList(){

// Deletes every cloud copy and then the account itself. Needs the password again, since Firebase only lets a

async function cloudDeleteAll(password){

  if(j.localId!==cloud.user.uid)throw 'That password is for a different account.';

// Automatic upload: only while the game is in front of the player, at most every 8 hours per slot, never mid-focus
// (giving up rewinds the save, so the cloud mustn't keep the un-rewound progress).
const cloudVisible=()=>!document.hidden&&nativeActive;
function cloudTick(){
  if(!CLOUD_ON||!cloud.user||!cloud.user.verified||!slot||titleOpen||cloudBusy||!cloudVisible()||focusing()||cloudConflict[slot])return;
  const now=Date.now(),l=linkFor(slot);
  if(l&&now>=l.at&&now-l.at<CLOUD_EVERY||now-cloudFailAt<CLOUD_RETRY)return;
  const n=slot;cloudBusy=true;

setInterval(cloudTick,60e3);
function cloudStatus(){

  if(!cloud.user.verified)return `Signed in as <b>${esc(cloud.user.email)}</b>.<br><span class="no">Verify your email to start backing up.</span>`;
  const l=slot&&linkFor(slot);

    l?`Slot ${slot} last backed up ${ago(Date.now()-l.at)}. It backs up every 8 hours while you play.`:`Slot ${slot} backs up every 8 hours while you play.`);

const cloudButtonLabel=()=>cloud.user?'Cloud saves':cloud.off?'Turn on cloud saves':'Set up cloud saves';

  if(!cloud.user){openCloudLogin();return;}
  if(!cloud.user.verified){openCloudVerify(justCreated===true);return;}
  modal('Cloud saves',`<p style="margin:0 0 6px">Signed in as <b>${esc(cloud.user.email)}</b>.</p><div id="cl-list"><p class="hint">Loading…</p></div><p class="hint" id="cl-msg"></p>`,
    [...(slot&&!titleOpen?[{label:`Upload slot ${slot}`,cls:'go',keep:true,fn:()=>upload()}]:[]),
     {label:'Turn off',cls:'warn',keep:true,fn:()=>openCloudOff()},{label:'Close'}]);
  const m=$('#cl-msg'),say=(t,bad)=>{m.textContent=t;m.className='hint'+(bad?' no':'');};
  let list={},busy=false;
  const draw=()=>{const el=$('#cl-list');if(!el)return;
    el.innerHTML=SLOTS.map(n=>{const c=list[n],v=c&&c.v;
      return `<div class="slot-card${c?'':' empty'}" style="text-align:left"><div class="sh"><span class="sn">Cloud slot ${n}</span><span class="sm2">${c?'Saved '+ago(Date.now()-c.last):'Empty'}</span></div>`+
        (c?`<div class="st"><b>${esc(v.name)}</b> · Character level ${charLevelFor(v.fxp)} · ${v.gold.toLocaleString()} gp<br>${c.device===cloud.device?'From this device':'From another device'}${linkFor(n)&&linkFor(n).t===c.t?' · matches this slot':''}</div>
          <div class="sb"><button class="btn" data-res="${n}">Restore to slot ${n}</button></div>`:'')+'</div>';}).join('');
    el.querySelectorAll('[data-res]').forEach(b=>{let armed=false;b.onclick=()=>{const n=+b.dataset.res;
      if(readSlotRaw(n)&&!armed){armed=true;b.textContent=`Replace local slot ${n}?`;setTimeout(()=>{armed=false;b.textContent=`Restore to slot ${n}`;},3000);return;}
      restore(n);};});};
  const refresh=()=>cloudList().then(l=>{list=l;draw();},e=>{const el=$('#cl-list');if(el)el.innerHTML='';say(cloudMsg(e),true);});
  function restore(n){const c=list[n];if(!c)return;
    const v=c.v;
    if(n===slot&&!titleOpen){native({type:'focusEnd',completed:false});applyState(v);save();msg(`Slot ${n} restored from the cloud.`,'m-green');}
    else writeSlot(n,v);
    cloud.links[n]={uid:cloud.user.uid,t:c.t,at:Date.now()};delete cloudConflict[n];storeCloud();
    $('#modal').hidden=true;cloudRerender();}
  let armedUp=false;
  async function upload(){
    if(busy||!slot)return;const n=slot,c=list[n],l=linkFor(n);
    // Overwriting a cloud copy this device didn't make (or hasn't seen) needs a second press.
    if(c&&(!l||l.t!==c.t)&&!armedUp){armedUp=true;say(`The cloud copy of slot ${n} isn't this one. Press Upload again to replace it.`,true);return;}
    busy=true;say('Uploading…');
    try{await cloudUpload(n,armedUp);armedUp=false;say(`Slot ${n} uploaded.`);await refresh();if(!titleOpen)renderOpts();}
    catch(e){say(e==='conflict'?'The cloud copy just changed. Check it and press Upload again.':cloudMsg(e),true);if(e==='conflict')await refresh();}
    busy=false;
  }
  refresh();
}

/* ================= BOOT ================= */
let resetting=false;
function start(data){
  state=freshState();applyState(state);resize();
  window.__ratidleSave=save;setInterval(save,8000);
  addEventListener('beforeunload',()=>save());
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
  lastWall=Date.now();requestAnimationFrame(t=>{last=t;frame(t);});
  if(data&&isObj(data.save)&&SLOTS.includes(data.slot))loadInto(data.slot,sanitize(data.save,{allowFocus:true}),true);
  else showTitle();
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>{if(!slot||titleOpen)return{};state.pos={x:player.x,z:player.z};return{slot,save:JSON.parse(JSON.stringify(state))};});}catch(e){}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
