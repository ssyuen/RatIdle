# Builds the iOS app and uploads it to TestFlight on every push to main that changes the app or the game it bundles.
# Skip a run by putting [eas skip] in the commit message. Run it by hand with:
#   npx eas-cli@latest workflow:run .eas/workflows/testflight.yml
name: TestFlight

on:
  push:
    branches: ['main']
    paths:
      - 'mobile/**'
      - 'web/index.html'
      - '!**/*.md'
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Upload to TestFlight
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
